[package]
name = "fulltime-plugin-bundesliga"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Bundesliga reference data-provider plugin for FullTime, wrapping openligadb against the fulltime-plugin-api contract."
license = "MIT"
repository = "https://github.com/pilgrimagesoftware/FullTime-Plugin-Bundesliga"
readme = "README.md"
keywords = ["fulltime", "plugin", "wasm", "football", "bundesliga"]
categories = ["data-structures"]
authors = ["Paul Schifferer <paul@schifferers.net>"]
exclude = [".github/*", ".gitignore"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fulltime-plugin-api = "0.1.1"
openligadb = "0.0.9"
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = { version = "2.0", default-features = false, features = ["std"] }

[dev-dependencies]
proptest = "1"
